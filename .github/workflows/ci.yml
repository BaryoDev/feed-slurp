name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` over `install` so a lockfile that drifts from package.json fails here
      # rather than silently resolving something different.
      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The package ships types; a build that emits none is a broken publish that
      # every other check would pass.
      - name: Types were emitted
        run: test -f dist/index.d.ts && test -f dist/index.d.mts
